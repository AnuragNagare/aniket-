# Render Blueprint for the Work Trail API, background worker, Postgres and Redis.
# The web dashboard is deployed separately on Vercel (see apps/web/vercel.json).
# Values marked `sync: false` are asked for in the Render dashboard and never stored in git.
# Use at least the Starter plan for api and worker: the worker runs headless Chromium for PDFs.

databases:
  - name: worktrail-db
    databaseName: worktrail
    plan: basic-256mb
    region: singapore

services:
  - type: keyvalue
    name: worktrail-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction # BullMQ needs jobs never evicted
    ipAllowList: [] # internal connections only

  - type: web
    name: worktrail-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    # Pinned: the production image has no prisma CLI, and an unpinned `npx prisma` could pull a different major version.
    preDeployCommand: npx --yes prisma@6.19.3 migrate deploy --schema prisma/schema.prisma
    envVars:
      - fromGroup: worktrail-shared
      - key: DATABASE_URL
        fromDatabase: { name: worktrail-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: worktrail-redis, property: connectionString }
      - key: WEB_ORIGIN
        sync: false # e.g. https://app.worktrail.in (the Vercel URL)

  - type: worker
    name: worktrail-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: worktrail-shared
      - key: DATABASE_URL
        fromDatabase: { name: worktrail-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: worktrail-redis, property: connectionString }
      - key: WEB_ORIGIN
        sync: false

envVarGroups:
  - name: worktrail-shared
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: QUEUE_DRIVER, value: bullmq }
      - { key: TRUST_PROXY, value: "true" }
      - { key: AI_ENABLED, value: "true" }
      - { key: AI_UPDATE_MODEL, value: openai/gpt-oss-20b }
      - { key: AI_REPORT_MODEL, value: openai/gpt-oss-120b }
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_REGION, value: auto }
      - { key: SENTRY_ENVIRONMENT, value: production }
      - { key: MAIL_FROM, sync: false }
      - { key: JWT_ACCESS_SECRET, generateValue: true } # shared so the worker and API agree
      - { key: GROQ_API_KEY, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: SENTRY_DSN, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
